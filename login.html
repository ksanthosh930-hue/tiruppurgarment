<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Login | DigiGarment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <img src="/assets/images/logo-light.png" alt="DigiGarment Logo">
            <h2>Website Administration</h2>
            <p>Sign in to manage homepage content, tools, and services.</p>
        </div>
        
        <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const errAlert = document.getElementById("errorAlert");
            errAlert.style.display = "none";
            
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.textContent = "Signing In...";
            
            const formData = new FormData(e.target);
            
            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    body: formData
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    window.location.href = "/admin";
                } else {
                    errAlert.textContent = data.detail || "Invalid username or password.";
                    errAlert.style.display = "block";
                }
            } catch (err) {
                console.error("Login request error:", err);
                errAlert.textContent = "Connection to authentication server failed.";
                errAlert.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
