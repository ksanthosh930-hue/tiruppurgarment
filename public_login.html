<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign In | TirupurGarment.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        :root {
            --dg-navy: #081226;
            --dg-light-navy: #0e1c38;
            --dg-red: #9E1B32;
            --dg-red-hover: #b92a43;
            --dg-slate: #64748B;
            --dg-bg: #F8FAFC;
            --dg-white: #FFFFFF;
            --dg-border: #E2E8F0;
        }

        body {
            background-color: var(--dg-bg);
            font-family: 'Inter', sans-serif;
            color: #0F172A;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-nav {
            background: var(--dg-navy);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .auth-nav .brand img {
            height: 38px;
        }

        .auth-nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auth-nav a:hover {
            color: #ffffff;
        }

        .auth-nav .nav-signup-btn {
            background: var(--dg-red);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            margin-left: 12px;
            text-decoration: none;
        }

        .auth-nav .nav-signup-btn:hover {
            background: var(--dg-red-hover);
        }

        .auth-container {
            max-width: 440px;
            width: 90%;
            margin: 50px auto;
            background: var(--dg-white);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(8, 18, 38, 0.06);
            border: 1px solid var(--dg-border);
            padding: 40px 32px;
            flex-grow: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .eyebrow {
            color: var(--dg-red);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--dg-navy);
            margin: 0 0 8px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .auth-header p {
            color: var(--dg-slate);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dg-navy);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--dg-border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--dg-navy);
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--dg-red);
            box-shadow: 0 0 0 3px rgba(158, 27, 50, 0.12);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--dg-red);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--dg-navy);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--dg-red);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg-alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }

        .msg-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .msg-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .auth-footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: var(--dg-slate);
        }

        .auth-footer-links a {
            color: var(--dg-red);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 28px 20px;
                margin: 30px auto;
            }
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <a class="brand" href="/">
            <img src="/assets/images/logo-light.png" alt="DigiGarment Logo">
        </a>
        <div>
            <a href="/jobs">Tiruppur Jobs</a>
            <a href="/signup" class="nav-signup-btn">Create Account</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <p class="eyebrow">DIGIGARMENT JOBS</p>
            <h1>Welcome Back</h1>
            <p>Sign in to your Job Seeker or Employer account</p>
        </div>

        <div id="alertBox" class="msg-alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address or Mobile Number</label>
                <input type="text" id="loginIdentifier" class="form-control" placeholder="Email or 10-digit mobile number" required autocomplete="username">
            </div>

            <div class="form-group">
                <div class="flex-between" style="margin-bottom: 6px;">
                    <label style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer-links">
            Don't have an account yet?<br>
            <a href="/jobseeker/register">Register as Job Seeker</a> &bull; <a href="/employer/register">Register as Employer</a>
        </div>
    </div>

    <script>
        function showAlert(msg, isError = true) {
            const el = document.getElementById("alertBox");
            el.textContent = msg;
            el.className = "msg-alert " + (isError ? "msg-error" : "msg-success");
            el.style.display = "block";
        }

        function hideAlert() {
            const el = document.getElementById("alertBox");
            el.style.display = "none";
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();

            const identifier = document.getElementById("loginIdentifier").value.trim();
            const password = document.getElementById("loginPassword").value;
            const btn = document.getElementById("submitBtn");

            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: identifier, password: password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Sign in failed. Please check your credentials.");
                }

                showAlert("Signed in successfully! Redirecting to your dashboard...", false);
                setTimeout(() => {
                    window.location.href = data.redirect_url || (data.role === "employer" ? "/dashboard/company" : "/dashboard/individual");
                }, 600);
            } catch (err) {
                showAlert(err.message || "Something went wrong. Please try again.");
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
