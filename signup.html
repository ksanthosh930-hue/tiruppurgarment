<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Create Account | TirupurGarment.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        :root {
            --dg-navy: #081226;
            --dg-light-navy: #0e1c38;
            --dg-red: #9E1B32;
            --dg-red-hover: #b92a43;
            --dg-slate: #64748B;
            --dg-bg: #F8FAFC;
            --dg-white: #FFFFFF;
            --dg-border: #E2E8F0;
        }

        body {
            background-color: var(--dg-bg);
            font-family: 'Inter', sans-serif;
            color: #0F172A;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-nav {
            background: var(--dg-navy);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .auth-nav .brand img {
            height: 38px;
        }

        .auth-nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auth-nav a:hover {
            color: #ffffff;
        }

        .auth-nav .nav-login-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            margin-left: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auth-nav .nav-login-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .auth-container {
            max-width: 580px;
            width: 92%;
            margin: 36px auto;
            background: var(--dg-white);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(8, 18, 38, 0.06);
            border: 1px solid var(--dg-border);
            padding: 36px 32px;
            flex-grow: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .eyebrow {
            color: var(--dg-red);
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .auth-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--dg-navy);
            margin: 0 0 8px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .auth-header p {
            color: var(--dg-slate);
            font-size: 14px;
            margin: 0;
        }

        /* Role Selector Tabs */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 10px;
        }

        .role-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--dg-slate);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .role-btn.active {
            background: var(--dg-white);
            color: var(--dg-navy);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .role-btn svg {
            width: 18px;
            height: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dg-navy);
            margin-bottom: 6px;
        }

        .form-group label span.req {
            color: var(--dg-red);
        }

        .form-group label span.opt {
            color: var(--dg-slate);
            font-weight: 400;
            font-size: 12px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--dg-border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--dg-navy);
            font-family: inherit;
            box-sizing: border-box;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--dg-red);
            box-shadow: 0 0 0 3px rgba(158, 27, 50, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--dg-red);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--dg-red-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg-alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.4;
        }

        .msg-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .msg-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .auth-footer-links {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: var(--dg-slate);
        }

        .auth-footer-links a {
            color: var(--dg-red);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .auth-container {
                padding: 24px 18px;
                margin: 20px auto;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .role-btn {
                font-size: 13px;
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <nav class="auth-nav">
        <a class="brand" href="/">
            <img src="/assets/images/logo-light.png" alt="DigiGarment Logo">
        </a>
        <div>
            <a href="/jobs">Tiruppur Jobs</a>
            <a href="/login" class="nav-login-btn">Sign In</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-header">
            <p class="eyebrow">DIGIGARMENT JOBS PLATFORM</p>
            <h1>Create Your Account</h1>
            <p>Connect directly with verified Tiruppur garment export companies & candidates</p>
        </div>

        <!-- Role Selector -->
        <div class="role-selector">
            <button type="button" class="role-btn active" id="btnRoleJobseeker" onclick="switchRole('jobseeker')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Job Seeker / Employee
            </button>
            <button type="button" class="role-btn" id="btnRoleEmployer" onclick="switchRole('employer')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
                Employer / Company
            </button>
        </div>

        <div id="alertBox" class="msg-alert"></div>

        <!-- 1. Employee Form -->
        <form id="employeeForm" onsubmit="handleEmployeeRegister(event)">
            <div class="form-group">
                <label>Full Name <span class="req">*</span></label>
                <input type="text" id="empFullName" class="form-control" placeholder="e.g. Kumaravel S" required autocomplete="name">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Mobile Number <span class="req">*</span></label>
                    <input type="tel" id="empMobile" class="form-control" placeholder="10-digit mobile (e.g. 9876543210)" required maxlength="10" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Email Address <span class="req">*</span></label>
                    <input type="email" id="empEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Password <span class="req">*</span></label>
                    <input type="password" id="empPassword" class="form-control" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm Password <span class="req">*</span></label>
                    <input type="password" id="empConfirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label>Location / Area <span class="opt">(Optional)</span></label>
                <input type="text" id="empLocation" class="form-control" placeholder="e.g. Tiruppur, Avinashi Road, Palladam">
            </div>

            <button type="submit" id="empSubmitBtn" class="btn-submit">Create Job Seeker Account</button>
        </form>

        <!-- 2. Employer Form -->
        <form id="employerForm" style="display: none;" onsubmit="handleEmployerRegister(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Company / Mill Name <span class="req">*</span></label>
                    <input type="text" id="emprCompanyName" class="form-control" placeholder="e.g. Apex Apparels Pvt Ltd" required>
                </div>
                <div class="form-group">
                    <label>HR / Recruiter Name <span class="req">*</span></label>
                    <input type="text" id="emprContactPerson" class="form-control" placeholder="e.g. Ramesh Kumar (HR Manager)" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Official Mobile Number <span class="req">*</span></label>
                    <input type="tel" id="emprMobile" class="form-control" placeholder="10-digit mobile" required maxlength="10" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Company Email <span class="req">*</span></label>
                    <input type="email" id="emprEmail" class="form-control" placeholder="hr@company.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Password <span class="req">*</span></label>
                    <input type="password" id="emprPassword" class="form-control" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm Password <span class="req">*</span></label>
                    <input type="password" id="emprConfirmPassword" class="form-control" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>WhatsApp Number <span class="opt">(Optional)</span></label>
                    <input type="tel" id="emprWhatsapp" class="form-control" placeholder="10-digit WhatsApp number" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Area / Industrial Hub <span class="opt">(Optional)</span></label>
                    <input type="text" id="emprArea" class="form-control" placeholder="e.g. Angeripalayam, Netaji Apparel Park">
                </div>
            </div>

            <button type="submit" id="emprSubmitBtn" class="btn-submit">Register Garment Company</button>
        </form>

        <div class="auth-footer-links">
            Already have an account? <a href="/login">Sign In here</a>
        </div>
    </div>

    <script>
        let currentRole = "jobseeker";

        function switchRole(role) {
            currentRole = role;
            const btnEmp = document.getElementById("btnRoleJobseeker");
            const btnEmpr = document.getElementById("btnRoleEmployer");
            const formEmp = document.getElementById("employeeForm");
            const formEmpr = document.getElementById("employerForm");
            hideAlert();

            if (role === "jobseeker") {
                btnEmp.classList.add("active");
                btnEmpr.classList.remove("active");
                formEmp.style.display = "block";
                formEmpr.style.display = "none";
                window.location.hash = "jobseeker";
            } else {
                btnEmp.classList.remove("active");
                btnEmpr.classList.add("active");
                formEmp.style.display = "none";
                formEmpr.style.display = "block";
                window.location.hash = "employer";
            }
        }

        // Initialize from URL path or hash
        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname.toLowerCase();
            const hash = window.location.hash.toLowerCase();
            if (path.includes("employer") || hash === "#employer") {
                switchRole("employer");
            } else {
                switchRole("jobseeker");
            }
        });

        function showAlert(msg, isError = true) {
            const el = document.getElementById("alertBox");
            el.textContent = msg;
            el.className = "msg-alert " + (isError ? "msg-error" : "msg-success");
            el.style.display = "block";
            el.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function hideAlert() {
            const el = document.getElementById("alertBox");
            el.style.display = "none";
        }

        async function handleEmployeeRegister(e) {
            e.preventDefault();
            hideAlert();

            const fullName = document.getElementById("empFullName").value.trim();
            const mobile = document.getElementById("empMobile").value.trim();
            const email = document.getElementById("empEmail").value.trim();
            const password = document.getElementById("empPassword").value;
            const confirmPassword = document.getElementById("empConfirmPassword").value;
            const location = document.getElementById("empLocation").value.trim();

            if (password !== confirmPassword) {
                showAlert("Passwords do not match. Please re-enter.");
                return;
            }

            const btn = document.getElementById("empSubmitBtn");
            btn.disabled = true;
            btn.textContent = "Creating Account...";

            try {
                const res = await fetch("/api/auth/register/employee", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name: fullName,
                        mobile: mobile,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword,
                        location: location || null
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Registration failed. Please check details.");
                }

                showAlert("Registration successful! Redirecting to dashboard...", false);
                setTimeout(() => {
                    window.location.href = data.redirect_url || "/dashboard/individual";
                }, 800);
            } catch (err) {
                showAlert(err.message || "Something went wrong. Please try again.");
                btn.disabled = false;
                btn.textContent = "Create Job Seeker Account";
            }
        }

        async function handleEmployerRegister(e) {
            e.preventDefault();
            hideAlert();

            const companyName = document.getElementById("emprCompanyName").value.trim();
            const contactPerson = document.getElementById("emprContactPerson").value.trim();
            const mobile = document.getElementById("emprMobile").value.trim();
            const email = document.getElementById("emprEmail").value.trim();
            const password = document.getElementById("emprPassword").value;
            const confirmPassword = document.getElementById("emprConfirmPassword").value;
            const whatsapp = document.getElementById("emprWhatsapp").value.trim();
            const area = document.getElementById("emprArea").value.trim();

            if (password !== confirmPassword) {
                showAlert("Passwords do not match. Please re-enter.");
                return;
            }

            const btn = document.getElementById("emprSubmitBtn");
            btn.disabled = true;
            btn.textContent = "Registering Company...";

            try {
                const res = await fetch("/api/auth/register/employer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        company_name: companyName,
                        contact_person: contactPerson,
                        mobile: mobile,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword,
                        whatsapp: whatsapp || null,
                        area: area || null
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Company registration failed. Please check details.");
                }

                showAlert("Registration successful! Redirecting to Employer Dashboard...", false);
                setTimeout(() => {
                    window.location.href = data.redirect_url || "/dashboard/company";
                }, 800);
            } catch (err) {
                showAlert(err.message || "Something went wrong. Please try again.");
                btn.disabled = false;
                btn.textContent = "Register Garment Company";
            }
        }
    </script>
</body>
</html>
